name: Build Xbox UWP Package

on:
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xbox:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Build TOD Xbox Live JS Bundle
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          msbuild xbox-uwp/TodXboxApp.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build & Sign Xbox UWP AppxBundle
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=39180ED3-CB8B-4F98-BAE6-68BF6163651D" `
            -KeyUsage DigitalSignature `
            -FriendlyName "lazhus" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "xbox-uwp/TodXboxApp.cer"
          Import-Certificate -FilePath "xbox-uwp/TodXboxApp.cer" -CertStoreLocation "Cert:\LocalMachine\Root"
          Import-Certificate -FilePath "xbox-uwp/TodXboxApp.cer" -CertStoreLocation "Cert:\LocalMachine\TrustedPeople"

          $out = msbuild xbox-uwp/TodXboxApp.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="x64" `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint="$($cert.Thumbprint)" `
            /p:GenerateAppxPackageOnBuild=true 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $out | Select-String -Pattern "error " | ForEach-Object { Write-Host "::error::$($_.Line)" }
          if ($code -ne 0) { exit $code }

      - name: Publish Signed Bundle to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = Get-ChildItem -Path "xbox-uwp/AppPackages" -Recurse -Include *.msixupload,*.appxupload,*.msixbundle,*.appxbundle | Select-Object -ExpandProperty FullName
          gh release delete v0.1.0 --yes 2>$null
          gh release create v0.1.0 $files "xbox-uwp/TodXboxApp.cer" `
            --title "TOD Xbox Live v0.1.0" `
            --notes "Partner Center StoreUpload (.msixupload) & Xbox Sideload (.msixbundle)"

      - name: Upload Xbox AppxBundle Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TodXboxApp-Xbox-Package
          path: |
            xbox-uwp/AppPackages/**/*
            xbox-uwp/TodXboxApp.cer
            dist/tod-xbox-live.bundle.js
