name: Build Xbox UWP Package

on:
  push:
    branches: [ main, "feat/**" ]
  workflow_dispatch:

jobs:
  build-xbox:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build TOD Xbox Live JS Bundle
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        shell: pwsh
        run: |
          msbuild xbox-uwp/TodXboxApp.csproj /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build Xbox UWP AppxBundle
        shell: pwsh
        run: |
          $out = msbuild xbox-uwp/TodXboxApp.csproj `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:AppxBundle=Always `
            /p:AppxBundlePlatforms="x64" `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false `
            /p:GenerateAppxPackageOnBuild=true 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $out | Select-String -Pattern "error " | ForEach-Object { Write-Host "::error::$($_.Line)" }
          if ($code -ne 0) { exit $code }

      - name: Upload Xbox AppxBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TodXboxApp-Xbox-Package
          path: |
            xbox-uwp/AppPackages/**/*
            dist/tod-xbox-live.bundle.js
